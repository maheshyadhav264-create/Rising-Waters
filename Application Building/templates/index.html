<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floods Prediction | Predict</title>
<link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

<nav class="navbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2c-4 5.5-7 9.3-7 13a7 7 0 0 0 14 0c0-3.7-3-7.5-7-13z"/></svg>
    </span>
    Floods Prediction
  </div>
  <div class="nav-links">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('index') }}" class="active">Predict Floods</a>
  </div>
</nav>

<main class="predict-wrap">
  <div class="predict-card">
    <span class="section-label">02 — Predictor</span>
    <h1>Enter this season's readings</h1>
    <p class="muted">All fields are required. Rainfall figures are in millimetres (mm).</p>

    <form action="{{ url_for('predict') }}" method="POST" class="predict-form" id="floodForm">
      <div class="field">
        <label for="cloud_cover">Cloud Cover</label>
        <input type="number" step="any" min="0" max="100" name="cloud_cover" id="cloud_cover"
               placeholder="Cloud Cover Percentage (%)" required>
      </div>

      <div class="field">
        <label for="annual_rainfall">Annual Rain Fall</label>
        <input type="number" step="any" min="0" name="annual_rainfall" id="annual_rainfall"
               placeholder="Enter Annual Rain Fall in mm" required>
      </div>

      <div class="field">
        <label for="jan_feb_rainfall">Jan-Feb Rainfall</label>
        <input type="number" step="any" min="0" name="jan_feb_rainfall" id="jan_feb_rainfall"
               placeholder="Jan-Feb Rainfall in mm" required>
      </div>

      <div class="field">
        <label for="mar_may_rainfall">March-May Rainfall</label>
        <input type="number" step="any" min="0" name="mar_may_rainfall" id="mar_may_rainfall"
               placeholder="March-May Rainfall in mm" required>
      </div>

      <div class="field full">
        <label for="jun_sep_rainfall">June-September</label>
        <input type="number" step="any" min="0" name="jun_sep_rainfall" id="jun_sep_rainfall"
               placeholder="June-September Rainfall in mm" required>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Predict</button>
      </div>
      <p class="form-error" id="formError" role="alert"></p>
    </form>
  </div>
</main>

<footer class="footer">
  <p>Floods Prediction — a demo hydrological ML application.</p>
</footer>

<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
