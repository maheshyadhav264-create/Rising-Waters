<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FloodWatch Station{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 24c3-3 5-3 8 0s5 3 8 0 5-3 8 0 5 3 8 0" stroke="#0E7C86" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M6 31c3-3 5-3 8 0s5 3 8 0 5-3 8 0 5 3 8 0" stroke="#4E8F97" stroke-width="2.4" stroke-linecap="round" opacity="0.6"/>
          <path d="M20 4c3.5 5 6 9 6 12.5a6 6 0 1 1-12 0C14 13 16.5 9 20 4Z" fill="#D89A32"/>
        </svg>
        <span>
          <span class="brand-text">FloodWatch Station</span>
          <span class="brand-sub">Flood Risk Assessment Console</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="{{ url_for('index') }}" class="{{ 'active' if active == 'home' else '' }}">Assessment</a>
        <a href="{{ url_for('about') }}" class="{{ 'active' if active == 'about' else '' }}">Model Report</a>
      </nav>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="site-footer">
    <div class="wrap">
      <span>FloodWatch Station — Flood Prediction ML Project</span>
      <span><strong>Note:</strong> demonstration model trained on synthetic data, not for real-world emergency decisions.</span>
    </div>
  </footer>
</body>
</html>
